name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  native-win32:
    name: Build & Test (Windows)
    runs-on: windows-latest
    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps_cache

    steps:
    - uses: actions/checkout@v4
    - uses: lukka/get-cmake@v4.3.3

    - name: Get Cache
      uses: actions/cache@v4
      with:
        key: DependencyCache-win32-msvc-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          DependencyCache-win32-msvc-
        path: |
          .deps_cache

    - name: Build Native Win32 x64
      run: |
        cmake -B build -DFETCHCONTENT_BASE_DIR=${{ env.FETCHCONTENT_BASE_DIR }}
        cmake --build build --config Release

    - name: Install software Vulkan driver (Dozen)
      # GitHub-hosted Windows runners have no GPU/Vulkan ICD. This installs
      # Mesa's Dozen driver (Vulkan-on-D3D12), which works via WARP with no
      # GPU required -- the Windows analog of Linux's mesa-vulkan-drivers.
      run: winget install --id Microsoft.OpenCLGLVulkanCompatibilityPack -e --silent --accept-package-agreements --accept-source-agreements

    - name: Install Vulkan SDK
      run: winget install --id KhronosGroup.VulkanSDK -e --silent --accept-package-agreements --accept-source-agreements

    - name: Run Tests (with Validation Layers)
      shell: pwsh
      run: |
        $vulkanSdk = Get-ChildItem -Path "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
        if ($vulkanSdk) {
          $env:VK_LAYER_PATH = "$($vulkanSdk.FullName)\Bin"
        }
        $env:VK_INSTANCE_LAYERS = "VK_LAYER_KHRONOS_validation"
        # Temporary suppression for upstream Vulkan-ValidationLayers bug where cubemap
        # transfers on (0,0,0) granularity queues falsely require extent.depth == layerCount (6).
        $env:VK_KHRONOS_VALIDATION_MESSAGE_ID_FILTER = "VUID-vkCmdCopyBufferToImage-imageOffset-07738,VUID-vkCmdCopyImage-srcOffset-01783,VUID-vkCmdCopyImage-dstOffset-01784"
        & ".\build\example\Release\sk_renderer_test.exe" -testall

  native-macos:
    name: Build (macOS)
    runs-on: macos-14
    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps_cache

    steps:
    - uses: actions/checkout@v4
    - uses: lukka/get-cmake@v4.3.3

    - name: Get Cache
      uses: actions/cache@v4
      with:
        key: DependencyCache-macos-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          DependencyCache-macos-
        path: |
          .deps_cache

    - name: Build Native macOS ARM64
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_BASE_DIR=${{ env.FETCHCONTENT_BASE_DIR }}
        cmake --build build --config Release

  native-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-22.04
    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps_cache

    steps:
    - uses: actions/checkout@v4
    - uses: lukka/get-cmake@v4.3.3

    - name: Get Cache
      uses: actions/cache@v4
      with:
        key: DependencyCache-linux-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          DependencyCache-linux-
        path: |
          .deps_cache

    - name: Install Prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm lld ninja-build pkg-config libx11-dev libxfixes-dev libxrandr-dev libxcursor-dev libxi-dev libfontconfig-dev libwayland-dev libxkbcommon-dev libdecor-0-dev mesa-vulkan-drivers vulkan-validationlayers xvfb

    - name: Build Native Linux x64
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_BASE_DIR=${{ env.FETCHCONTENT_BASE_DIR }}
        cmake --build build --config Release

    - name: Run Tests (with Validation Layers)
      id: run_tests
      run: |
        export VK_INSTANCE_LAYERS="VK_LAYER_KHRONOS_validation"
        export VK_KHRONOS_VALIDATION_MESSAGE_ID_FILTER="VUID-vkCmdCopyBufferToImage-imageOffset-07738,VUID-vkCmdCopyImage-srcOffset-01783,VUID-vkCmdCopyImage-dstOffset-01784"
        xvfb-run -a ./build/example/sk_renderer_test -testall

    - name: Diagnose crash (llvmpipe JIT SIGSEGV suspected)
      # The job already failed via the step above; this only adds diagnostics
      # to the log and never changes the job's pass/fail result.
      if: failure() && steps.run_tests.outcome == 'failure'
      continue-on-error: true
      run: |
        set +e
        sudo apt-get install -y gdb
        export VK_INSTANCE_LAYERS="VK_LAYER_KHRONOS_validation"
        export VK_KHRONOS_VALIDATION_MESSAGE_ID_FILTER="VUID-vkCmdCopyBufferToImage-imageOffset-07738,VUID-vkCmdCopyImage-srcOffset-01783,VUID-vkCmdCopyImage-dstOffset-01784"

        echo "::group::Retry with LP_NUM_THREADS=0 (rules out an llvmpipe JIT worker-thread race)"
        LP_NUM_THREADS=0 xvfb-run -a ./build/example/sk_renderer_test -testall
        echo "exit code: $?"
        echo "::endgroup::"

        echo "::group::Retry under gdb for a backtrace of every thread"
        xvfb-run -a gdb -q -batch -ex run -ex "thread apply all bt" -ex quit --args ./build/example/sk_renderer_test -testall
        echo "::endgroup::"

  native-android:
    name: Build (Android)
    runs-on: ubuntu-22.04
    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps_cache

    steps:
    - uses: actions/checkout@v4
    - uses: lukka/get-cmake@v4.3.3

    - name: Get Cache
      uses: actions/cache@v4
      with:
        key: DependencyCache-android-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          DependencyCache-android-
        path: |
          .deps_cache

    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1.4.2
      id: setup-ndk
      with:
        ndk-version: r25c
        local-cache: true

    - name: Restore Android Symlinks
      run: |
        directory="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
        find "$directory" -type l | while read link; do
            current_target=$(readlink "$link")
            new_target="$directory/$(basename "$current_target")"
            ln -sf "$new_target" "$link"
            echo "Changed $(basename "$link") from $current_target to $new_target"
        done

    - name: Install Android SDK Platform
      run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-29" "platforms;android-32" "platforms;android-33"

    - name: Build Native Android ARM64
      run: |
        cmake -B build-android -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake -DCMAKE_ANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }} -DANDROID_PLATFORM=android-32 -DCMAKE_SYSTEM_NAME=Android -DCMAKE_SYSTEM_VERSION=32 -DANDROID_ABI=arm64-v8a -DFETCHCONTENT_BASE_DIR=${{ env.FETCHCONTENT_BASE_DIR }}
        cmake --build build-android --config Release
